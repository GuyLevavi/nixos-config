# Laptop idle policy. Both hosts share this.

general {
    # loginctl lock-session routes to Noctalia's own native lock screen when
    # Noctalia is running (docs/user/ipc/shell.mdx) — hyprlock was a DMS-era
    # leftover that bypassed it and showed an unthemed generic lock UI.
    lock_cmd = loginctl lock-session
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 150                          # 2.5 min
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

listener {
    timeout = 300                          # 5 min
    on-timeout = loginctl lock-session
}

listener {
    timeout = 360                          # 6 min
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 1800                         # 30 min
    on-timeout = systemctl suspend
}
