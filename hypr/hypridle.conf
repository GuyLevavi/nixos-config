# Laptop idle policy. Both hosts share this.

general {
    # lock_cmd MUST be a real locker, never `loginctl lock-session`: hypridle
    # subscribes to logind's Lock signal, and loginctl EMITS it — so pointing
    # lock_cmd at loginctl is a self-triggering loop (measured at 3110 fork/s,
    # 2.9M processes in 4.3h, clocks pinned at 3.8GHz, package at 85-92C).
    # Noctalia's IPC locks directly and only calls SetLockedHint, so it cannot
    # re-enter (noctalia src/dbus/logind/logind_service.cpp:94,142).
    # The listeners below still use `loginctl lock-session` — that is correct:
    # they ask logind to broadcast Lock, which is what drives lock_cmd.
    lock_cmd = noctalia msg session lock
    before_sleep_cmd = noctalia msg session lock
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 150                          # 2.5 min
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

listener {
    timeout = 300                          # 5 min
    on-timeout = loginctl lock-session
}

listener {
    timeout = 360                          # 6 min
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 1800                         # 30 min
    on-timeout = systemctl suspend
}
