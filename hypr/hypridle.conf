# Laptop idle policy. Both hosts share this.

general {
    # NEVER `loginctl lock-session` here: hypridle subscribes to logind's Lock
    # signal and loginctl emits it, so that is a self-triggering loop (measured
    # 3110 fork/s, package at 92C). Noctalia's IPC only calls SetLockedHint and
    # cannot re-enter. The listeners below correctly still use loginctl — asking
    # logind to broadcast Lock is what should drive lock_cmd.
    lock_cmd = noctalia msg session lock
    before_sleep_cmd = noctalia msg session lock
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 150                          # 2.5 min
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

listener {
    timeout = 300                          # 5 min
    on-timeout = loginctl lock-session
}

listener {
    timeout = 360                          # 6 min
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 1800                         # 30 min
    on-timeout = systemctl suspend
}
