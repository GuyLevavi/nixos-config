# `noctalia msg` verbs are from the v5 CLI schema. Panel ids are free-form —
# `noctalia msg panel-toggle --help` lists them.

$mod = SUPER

# ------------------------------------------------------------------- shell ---
bind = $mod, Space,  exec, noctalia msg panel-toggle launcher
bind = $mod, V,      exec, noctalia msg panel-toggle clipboard
bind = $mod, N,      exec, noctalia msg panel-toggle control-center
bind = $mod, S,      exec, noctalia msg settings-toggle
bind = $mod, Tab,    exec, noctalia msg window-switcher
bind = $mod, L,      exec, noctalia msg session lock
bind = $mod SHIFT, E, exec, noctalia msg panel-toggle session

# Emoji: open the launcher and type the emoji prefix.

# ------------------------------------------------------------------- theme ---
bind = $mod, T,       exec, noctalia msg settings-open       # pick a palette in the GUI
bind = $mod SHIFT, T, exec, noctalia msg theme-mode-toggle   # dark <-> light
bind = $mod, W,       exec, noctalia msg wallpaper-next

# -------------------------------------------------------------- screenshot ---
bind = , Print,        exec, noctalia msg screenshot-region
bind = SHIFT, Print,   exec, noctalia msg screenshot-fullscreen pick
bind = $mod, Print,    exec, screen-record

# --------------------------------------------------------------- launchers ---
bind = $mod, Return, exec, ghostty
bind = $mod, B,      exec, firefox
bind = $mod, E,      exec, nautilus

# ------------------------------------------------------------------ windows ---
bind = $mod, Q, killactive
bind = $mod, F, fullscreen, 0
bind = $mod, G, togglefloating
bind = $mod, P, pseudo
bind = $mod, J, layoutmsg, togglesplit

bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d

bind = $mod SHIFT, left,  movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up,    movewindow, u
bind = $mod SHIFT, down,  movewindow, d

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# --------------------------------------------------------------- workspaces ---
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5

bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up,   workspace, e-1

# ------------------------------------------------------------------- media ---
# bindl/bindel fire even when locked.
bindl  = , XF86AudioMute,         exec, noctalia msg volume-mute
bindl  = , XF86AudioMicMute,      exec, noctalia msg mic-mute
bindel = , XF86AudioRaiseVolume,  exec, noctalia msg volume-up
bindel = , XF86AudioLowerVolume,  exec, noctalia msg volume-down
bindel = , XF86MonBrightnessUp,   exec, noctalia msg brightness-up
bindel = , XF86MonBrightnessDown, exec, noctalia msg brightness-down

bindl = , XF86AudioPlay, exec, noctalia msg media toggle
bindl = , XF86AudioNext, exec, noctalia msg media next
bindl = , XF86AudioPrev, exec, noctalia msg media previous

# ------------------------------------------------------------------ toggles ---
bind = $mod, F1, exec, noctalia msg wifi-toggle
bind = $mod, F2, exec, noctalia msg bluetooth-toggle
bind = $mod, F3, exec, noctalia msg nightlight-toggle
bind = $mod, F4, exec, noctalia msg caffeine-toggle
bind = $mod, F5, exec, noctalia msg notification-dnd-toggle
bind = $mod, F6, exec, noctalia msg bar-toggle
