# Not in the nix store — home-manager symlinks ~/.config/hypr/ to the working
# tree. Edit and `hyprctl reload`, no rebuild.

source = ./binds.conf

# Per-panel overrides first (matched by hardware desc, so this stays correct
# regardless of which host it runs on) — generic fallback last.
# gpubox panel: scale 1 instead of fractional.
monitor = desc:Sharp Corporation LQ156T1JW05, highrr, auto, 1

# Generic default for both laptops. `hyprctl monitors` for names, pin if docked.
# highrr = highest refresh rate at that mode's resolution (not just "preferred").
monitor = , highrr, auto, 1.25

input {
    kb_layout = us,il
    kb_options = grp:alt_shift_toggle,caps:escape
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
        disable_while_typing = true
        tap-to-click = true
        scroll_factor = 0.6
    }
}

# gesture syntax: <fingers>, <direction>, <action>[, args]
gesture = 3, horizontal, workspace

cursor {
    # Hide the pointer after 4s of no movement; any motion brings it straight
    # back. Mostly this stops a stray cursor from parking on top of the text
    # you are reading in a full-screen editor or a video.
    inactive_timeout = 4
    # ...and hide it the instant you start typing, without waiting out the
    # timeout. Off by default in Hyprland.
    hide_on_key_press = true
}

general {
    # One gap constant for the whole desktop: 8px between everything. gaps_in
    # is a HALF-gap in Hyprland, so gaps_in = gaps_out / 2 makes window<->window
    # equal window<->screen-edge. home/noctalia.nix matches it on the bar side
    # (margin_edge/padding/widget_spacing = 8, margin_ends = 0). Changing
    # gaps_out here means changing those three too, or the bar drifts off-grid.
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    # overridden by ~/.config/hypr/noctalia.conf (sourced at end) on theme switch
    col.active_border = rgba(89b4faee)
    col.inactive_border = rgba(45475aaa)
    layout = dwindle
    allow_tearing = false
    resize_on_border = true
}

decoration {
    rounding = 8
    active_opacity = 1.0
    # 0.85 + blur = the same frosted material as the bar islands (capsule
    # opacity 0.85 in home/noctalia.nix) and ghostty's inactive rule below.
    inactive_opacity = 0.85
    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
    }
    shadow {
        enabled = true
        range = 12
        render_power = 3
    }
}

animations {
    enabled = true
    bezier = smooth, 0.05, 0.9, 0.1, 1.0
    animation = windows, 1, 4, smooth
    animation = windowsOut, 1, 4, default, popin 80%
    animation = fade, 1, 4, default
    animation = workspaces, 1, 4, smooth, slide
}

dwindle {
    preserve_split = true
    force_split = 2 # new windows always open right/bottom (Omarchy-style)
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    vrr = 1
}

# vfr is debug-only since 0.55 but there's no prod replacement for the battery win
debug {
    vfr = true
}

windowrule = match:class .*, suppress_event = maximize
windowrule = match:class ^(pavucontrol|nm-connection-editor|blueman-manager)$, float = true
windowrule = match:title ^(Open File|Save File|Choose Files)$, float = true
windowrule = match:title ^(Open File|Save File|Choose Files)$, size 60% 60%
windowrule = match:class ^(ghostty)$, opacity 0.95 0.85
windowrule = match:class ^(xwaylandvideobridge)$, no_anim = true # blank XWayland windows on dGPU

layerrule {
    name = noctalia_blur
    # Namespaces are "noctalia-bar-<name>", not "noctalia" — an exact-match
    # ^(noctalia)$ matches nothing and blur silently never applies.
    match:namespace = ^(noctalia-bar-.*)$
    blur = true
    # The strip is background_opacity 0 and must stay invisible; only the
    # 0.85-alpha islands should frost.
    ignore_alpha = 0.2
}

# Noctalia runs as a systemd user unit (home/noctalia.nix), not from here.
exec-once = hypridle
exec-once = wl-paste --watch cliphist store
exec-once = monitor-watch # disable eDP-1 whenever an external monitor is present

source = ~/.config/hypr/noctalia.conf # Noctalia colour templates

# monitor-watch (home/scripts.nix) writes "monitor = eDP-1, disable" here while
# docked, empty otherwise. Sourced (not a keyword) so it survives the reload
# Noctalia triggers on every theme switch; name-match beats the rules above.
source = ~/.config/hypr/monitor-state.conf
