# Out-of-store symlink: edit + `hyprctl reload`, no rebuild.

source = ./binds.conf

# Docked 1080p panel: scale 1, not the fractional default below.
monitor = desc:ASUSTek COMPUTER INC ASUS VG249 0x00019552, highrr, auto, 1

# Generic default for both laptops (`hyprctl monitors` for names).
monitor = , highrr, auto, 1.25

input {
    kb_layout = us,il
    kb_options = grp:alt_shift_toggle,caps:escape
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
        disable_while_typing = true
        tap-to-click = true
        scroll_factor = 0.6
    }
}

# gesture syntax: <fingers>, <direction>, <action>[, args]
gesture = 3, horizontal, workspace

cursor {
    # Hide after 4s idle; any motion brings it back.
    inactive_timeout = 4
    # ...and immediately on typing (off by default in Hyprland).
    hide_on_key_press = true
}

general {
    # One gap constant, 8. gaps_in is a HALF-gap in Hyprland, so
    # gaps_in = gaps_out / 2. The bar mirrors this in home/noctalia.nix —
    # change both together or the islands drift off the window grid.
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    # overridden by ~/.config/hypr/noctalia.conf (sourced at end) on theme switch
    col.active_border = rgba(89b4faee)
    col.inactive_border = rgba(45475aaa)
    layout = dwindle
    allow_tearing = false
    resize_on_border = true
}

decoration {
    rounding = 8
    active_opacity = 1.0
    # 0.85 + blur = the islands' frosted material (capsule opacity in noctalia.nix).
    inactive_opacity = 0.85
    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
    }
    shadow {
        enabled = true
        range = 12
        render_power = 3
    }
}

animations {
    enabled = true
    bezier = smooth, 0.05, 0.9, 0.1, 1.0
    animation = windows, 1, 4, smooth
    animation = windowsOut, 1, 4, default, popin 80%
    animation = fade, 1, 4, default
    animation = workspaces, 1, 4, smooth, slide
}

dwindle {
    preserve_split = true
    force_split = 2 # new windows always open right/bottom (Omarchy-style)
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    vrr = 1
}

# vfr is debug-only since 0.55 but there's no prod replacement for the battery win
debug {
    vfr = true
}

windowrule = match:class .*, suppress_event = maximize
windowrule = match:class ^(pavucontrol|nm-connection-editor|blueman-manager)$, float = true
windowrule = match:title ^(Open File|Save File|Choose Files)$, float = true
windowrule = match:title ^(Open File|Save File|Choose Files)$, size 60% 60%
windowrule = match:class ^(ghostty)$, opacity 0.95 0.85
windowrule = match:class ^(xwaylandvideobridge)$, no_anim = true # blank XWayland windows on dGPU

layerrule {
    name = noctalia_blur
    # Namespaces are "noctalia-bar-<name>"; an exact-match ^(noctalia)$ blurs
    # nothing.
    match:namespace = ^(noctalia-bar-.*)$
    blur = true
    # Only the 0.85-alpha islands frost; the strip itself is transparent.
    ignore_alpha = 0.2
}

# Noctalia is a systemd user unit (home/noctalia.nix) and owns idle too.
exec-once = wl-paste --watch cliphist store
exec-once = monitor-watch # disable eDP-1 whenever an external monitor is present

source = ~/.config/hypr/noctalia.conf # Noctalia colour templates

# Written by monitor-watch (home/scripts.nix): disable eDP-1 while docked,
# empty otherwise. Sourced, not a keyword, so it survives reloads.
source = ~/.config/hypr/monitor-state.conf
